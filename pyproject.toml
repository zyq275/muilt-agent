[project]
name = "tanyuan"
version = "0.1.0"
description = "探渊 · 多智能体数据分析系统"
requires-python = ">=3.12"
dependencies = [
    # Web 框架 & ASGI 服务器
    "fastapi>=0.136",
    "uvicorn>=0.48",
    # FastAPI 解析 multipart 表单必需（/api/upload 用了 Form(...) + File(...)）。
    # 它不是 fastapi 的依赖，不显式声明就会在导入应用时报
    # RuntimeError: Form data requires "python-multipart" to be installed.
    "python-multipart>=0.0.9",

    # 多智能体框架
    "deepagents>=0.6.6",

    # LLM 接入
    "langchain-openai",
    "langchain-core",

    # 数据库驱动
    "mysql-connector-python>=9.7",

    # 向量数据库 & Embedding
    "langchain-chroma",
    "langchain-huggingface",
    "sentence-transformers",

    # 文档分块
    "langchain-text-splitters",

    # 全网检索
    "tavily-python>=0.7",

    # 文档解析
    "python-docx",
    "pypdf",
    "openpyxl",
    "pandas",

    # PDF 生成（Markdown→HTML→Word COM→PDF）
    "markdown",
    "pywin32; sys_platform == 'win32'",

    # 日志
    "colorlog",

    # 提示词配置
    "pyyaml",

    # 环境配置
    "python-dotenv",
]

[project.scripts]
tanyuan = "main:main"

[build-system]
# 必须是 setuptools.build_meta。原先写的 setuptools.backends._legacy:_Backend
# 并不存在（setuptools 84 里没有 setuptools.backends 这个模块），
# 会让 pip install 直接抛 BackendUnavailable: No module named 'setuptools.backends'。
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# 本项目是「应用」而非「库」，顶层是一堆平铺目录。setuptools 的扁平布局
# 自动发现会把这些目录全当成包并直接报错：
#   Multiple top-level packages discovered in a flat-layout:
#   ['api', 'sql', 'eval', 'agent', 'model', 'output', 'upload', ...]
# 它分不清 eval/ upload/ output/ 这些根本不是包的目录。所以显式声明：
# 真包只有 agent（含 agent.sub_agents）、api、tools、utils，
# 加一个顶层模块 main.py（[project.scripts] 的 tanyuan 指向它的 main 函数）。
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "tools*", "utils*"]
